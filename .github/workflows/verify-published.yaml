name: Verify public image

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Published sha256 digest from Verify and publish
        required: true
        type: string
      revision:
        description: Full source commit recorded on that image
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-public:
    name: Anonymous GHCR pull and real production acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/long2know/retroassembly
      DIGEST: ${{ inputs.digest }}
      REVISION: ${{ inputs.revision }}
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: 'true'
    steps:
      - name: Validate immutable inputs
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Anonymous manifests must match the published digest
        run: |
          mkdir -p node_modules/.cache/ci
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import fs from 'node:fs/promises'
          const response = await fetch('https://ghcr.io/token?service=ghcr.io&scope=repository:long2know/retroassembly:pull')
          assert.equal(response.status, 200, 'Package must permit anonymous pull')
          const { token } = await response.json()
          const manifests = []
          for (const reference of [`sha-${process.env.REVISION}`, process.env.DIGEST]) {
            const manifest = await fetch(`https://ghcr.io/v2/long2know/retroassembly/manifests/${reference}`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' },
            })
            assert.equal(manifest.status, 200, 'Anonymous immutable manifest must be readable')
            const digest = `sha256:${createHash('sha256').update(Buffer.from(await manifest.arrayBuffer())).digest('hex')}`
            assert.equal(digest, process.env.DIGEST)
            assert.equal(manifest.headers.get('docker-content-digest'), digest)
            manifests.push({ reference, digest })
          }
          await fs.writeFile('node_modules/.cache/ci/anonymous.json', `${JSON.stringify({ public: true, manifests }, null, 2)}\n`)
          JS
      - name: Pull anonymously and verify OCI labels
        run: |
          export DOCKER_CONFIG="$GITHUB_WORKSPACE/node_modules/.cache/anonymous-docker"
          mkdir -p "$DOCKER_CONFIG"
          docker image pull "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = https://github.com/long2know/retroassembly
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = MIT
      - name: Browser, read-only mounts and persistence against public image
        env:
          RETROASSEMBLY_MOUNTED_TEST_IMAGE: ${{ env.IMAGE }}@${{ env.DIGEST }}
          RETROASSEMBLY_MOUNTED_TEST_BROWSER: chromium
          RETROASSEMBLY_MOUNTED_TEST_REPORT: node_modules/.cache/ci/public-image.json
        run: node tests/e2e/mounted-library-docker.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-image-acceptance-${{ github.run_attempt }}
          path: node_modules/.cache/ci/
          include-hidden-files: true
          retention-days: 30
